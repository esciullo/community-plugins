name = "Pulumi"
type = "cli"

[plugin]
description = "Infrastructure as code in any programming language."
homepage-url = "https://www.pulumi.com/"
repository-url = "https://github.com/pulumi/pulumi"

[resolve]
git-url = "https://github.com/pulumi/pulumi"
# The repo also tags Go modules as pkg/vX and sdk/vX; only v3 releases share this asset layout.
version-pattern = "^v(?<major>3)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$"

[platform.linux]
download-file = "pulumi-v{version}-linux-{arch}.tar.gz"
checksum-file = "pulumi-{version}-checksums.txt"
archive-prefix = "pulumi"
exe-path = "pulumi"
archs = ["x64", "arm64"]

[platform.macos]
download-file = "pulumi-v{version}-darwin-{arch}.tar.gz"
checksum-file = "pulumi-{version}-checksums.txt"
archive-prefix = "pulumi"
exe-path = "pulumi"
archs = ["x64", "arm64"]

[platform.windows]
download-file = "pulumi-v{version}-windows-{arch}.zip"
checksum-file = "pulumi-{version}-checksums.txt"
archive-prefix = "pulumi"
exe-path = "bin/pulumi.exe"
archs = ["x64", "arm64"]

[install]
download-url = "https://github.com/pulumi/pulumi/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/pulumi/pulumi/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "x64"
