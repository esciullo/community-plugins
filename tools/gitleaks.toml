name = "Gitleaks"
type = "cli"

[plugin]
description = "A fast, light-weight, portable, and open-source secret scanner for Git repositories, files, and directories."
homepage-url = "https://gitleaks.io/"
repository-url = "https://github.com/gitleaks/gitleaks"

[resolve]
git-url = "https://github.com/gitleaks/gitleaks"

[platform.linux]
archs = ["x86", "x64", "arm", "arm64"]
download-file = "gitleaks_{version}_linux_{arch}.tar.gz"
checksum-file = "gitleaks_{version}_checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "gitleaks_{version}_darwin_{arch}.tar.gz"
checksum-file = "gitleaks_{version}_checksums.txt"

[platform.windows]
archs = ["x86", "x64", "arm64"]
download-file = "gitleaks_{version}_windows_{arch}.zip"
checksum-file = "gitleaks_{version}_checksums.txt"

[install]
download-url = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/{checksum_file}"

[install.arch]
arm = "armv6"
aarch64 = "arm64"
x86 = "x32"
x86_64 = "x64"
