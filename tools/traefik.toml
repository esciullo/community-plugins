name = "Traefik"
type = "cli"

[plugin]
description = "A modern HTTP reverse proxy and load balancer that makes deploying microservices easy."
homepage-url = "https://traefik.io/"
repository-url = "https://github.com/traefik/traefik"

[resolve]
git-url = "https://github.com/traefik/traefik"

[platform.linux]
archs = ["x86", "x64", "arm", "arm64", "powerpc64", "riscv64", "s390x"]
download-file = "traefik_v{version}_linux_{arch}.tar.gz"
checksum-file = "traefik_v{version}_checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "traefik_v{version}_darwin_{arch}.tar.gz"
checksum-file = "traefik_v{version}_checksums.txt"

[platform.windows]
archs = ["x86", "x64", "arm64"]
download-file = "traefik_v{version}_windows_{arch}.zip"
checksum-file = "traefik_v{version}_checksums.txt"

[platform.freebsd]
archs = ["x86", "x64"]
download-file = "traefik_v{version}_freebsd_{arch}.tar.gz"
checksum-file = "traefik_v{version}_checksums.txt"

[platform.openbsd]
archs = ["x86", "x64", "riscv64"]
download-file = "traefik_v{version}_openbsd_{arch}.tar.gz"
checksum-file = "traefik_v{version}_checksums.txt"

[install]
download-url = "https://github.com/traefik/traefik/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/traefik/traefik/releases/download/v{version}/{checksum_file}"

[install.arch]
arm = "armv6"
aarch64 = "arm64"
powerpc64 = "ppc64le"
x86 = "386"
x86_64 = "amd64"
