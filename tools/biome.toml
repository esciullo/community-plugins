name = "Biome"
type = "cli"

[plugin]
description = "A performant toolchain for web projects, aiming to provide developer tools to maintain the health of said projects."
homepage-url = "https://biomejs.dev/"
repository-url = "https://github.com/biomejs/biome"

[resolve]
git-url = "https://github.com/biomejs/biome/"
version-pattern = "^@biomejs/biome@((?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?<pre>-[0-9a-zA-Z\\.]+)?)$"

[platform.linux]
download-file = "biome-linux-{arch}{libc}"
archs = ["x64", "arm64"]

[platform.macos]
download-file = "biome-darwin-{arch}"
archs = ["x64", "arm64"]

[platform.windows]
download-file = "biome-win32-{arch}.exe"
archs = ["x64", "arm64"]

[install]
download-url = "https://github.com/biomejs/biome/releases/download/%40biomejs/biome%40{version}/{download_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "x64"

[install.libc]
gnu = ""
musl = "-musl"