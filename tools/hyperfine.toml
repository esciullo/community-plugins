name = "hyperfine"
type = "cli"

[plugin]
description = "A command-line benchmarking tool."
repository-url = "https://github.com/sharkdp/hyperfine"

[resolve]
git-url = "https://github.com/sharkdp/hyperfine"

[platform.linux]
archs = ["x86", "x64", "arm64"]
archive-prefix = "hyperfine-v{version}-{arch}-unknown-linux-{libc}"
download-file = "hyperfine-v{version}-{arch}-unknown-linux-{libc}.tar.gz"

[platform.macos]
archs = ["x64", "arm64"]
archive-prefix = "hyperfine-v{version}-{arch}-apple-darwin"
download-file = "hyperfine-v{version}-{arch}-apple-darwin.tar.gz"

[platform.windows]
archs = ["x86", "x64"]
archive-prefix = "hyperfine-v{version}-{arch}-pc-windows-msvc"
download-file = "hyperfine-v{version}-{arch}-pc-windows-msvc.zip"

[install]
download-url = "https://github.com/sharkdp/hyperfine/releases/download/v{version}/{download_file}"

[install.arch]
x86 = "i686"
