name = "oxlint"
type = "cli"

[plugin]
description = "Oxlint is a JavaScript linter designed to catch erroneous or useless code without requiring any configurations by default."
homepage-url = "https://oxc-project.github.io/"
repository-url = "https://github.com/oxc-project/oxc"

[resolve]
git-url = "https://github.com/oxc-project/oxc"
version-pattern = "^apps_v((?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+))$"

[platform.freebsd]
archs = ["x64"]
download-file = "oxlint-{arch}-unknown-freebsd.tar.gz"
exe-path = "oxlint-{arch}-unknown-freebsd"

[platform.linux]
archs = ["arm64", "riscv64", "x64"]
download-file = "oxlint-{arch}-unknown-linux-{libc}.tar.gz"
exe-path = "oxlint-{arch}-unknown-linux-{libc}"

[platform.linux.arch]
riscv64 = "riscv64gc"

[platform.macos]
archs = ["arm64", "x64"]
download-file = "oxlint-{arch}-apple-darwin.tar.gz"
exe-path = "oxlint-{arch}-apple-darwin"

[platform.windows]
archs = ["arm64", "x64", "x86"]
download-file = "oxlint-{arch}-pc-windows-msvc.zip"
exe-path = "oxlint-{arch}-pc-windows-msvc"

[platform.windows.arch]
x86 = "i686"

[install]
download-url = "https://github.com/oxc-project/oxc/releases/download/apps_v{version}/{download_file}"
