name: Test changed plugins

on:
  pull_request:
    paths:
      - "tools/*.toml"
  workflow_dispatch:
    inputs:
      tools:
        description: "Space separated plugin names to test (e.g. biome ruff)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      tools: ${{ steps.changed.outputs.tools }}
    steps:
      - uses: actions/checkout@v7

      # Asking the API beats diffing locally: it needs no history, and it
      # reports renames and deletions accurately.
      - name: Collect changed plugins
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TOOLS: ${{ inputs.tools }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$INPUT_TOOLS" ]; then
            tools="$INPUT_TOOLS"
          else
            # A plugin deleted by this pull request has nothing left to install.
            # Filtering in jq rather than grep keeps an empty result at exit 0,
            # which matters because bash runs with pipefail here.
            tools=$(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
                --jq '.[] | select(.status != "removed") | .filename | select(test("^tools/[^/]+\\.toml$"))' \
                | sed 's|^tools/||; s|\.toml$||' \
                | sort -u \
                | tr '\n' ' '
            )
          fi

          echo "Changed plugins: ${tools:-(none)}"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          TOOLS: ${{ steps.changed.outputs.tools }}
        run: |
          if [ -z "$TOOLS" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Unquoted on purpose: the plugin names are a space separated list.
          python3 ./scripts/plan-install-matrix.py $TOOLS >> "$GITHUB_OUTPUT"

  install:
    needs: plan
    if: needs.plan.outputs.count != '0'
    uses: ./.github/workflows/install-plugins.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}

  results:
    name: Results
    needs:
      - plan
      - install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check install results
        env:
          TOOLS: ${{ needs.plan.outputs.tools }}
          COUNT: ${{ needs.plan.outputs.count }}
          RESULT: ${{ needs.install.result }}
        run: |
          if [ "$COUNT" = "0" ]; then
            echo "No plugins changed, nothing to install."
            exit 0
          fi

          echo "Planned $COUNT install jobs for:$TOOLS"

          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more changed plugins failed to install."
            exit 1
          fi

          echo "All changed plugins installed and resolved an executable."
