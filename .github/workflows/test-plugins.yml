name: Test plugins

on:
  push:
    branches:
      - master
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      # Also doubles as a lint pass: the script fails on malformed TOML or a
      # plugin with no [platform.*] sections, before we spend any runner time.
      - id: plan
        run: python3 ./scripts/plan-install-matrix.py >> "$GITHUB_OUTPUT"

  install:
    needs: plan
    uses: ./.github/workflows/install-plugins.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}

  results:
    name: Results
    needs:
      - plan
      - install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check install results
        run: |
          echo "Planned ${{ needs.plan.outputs.count }} install jobs."

          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "::error::One or more plugins failed to install."
            exit 1
          fi

          echo "All plugins installed and resolved an executable."
