name = "Hurl"
type = "cli"

[plugin]
description = "A command line tool that runs HTTP requests defined in a simple plain text format."
homepage-url = "https://hurl.dev/"
repository-url = "https://github.com/Orange-OpenSource/hurl"

[resolve]
git-url = "https://github.com/Orange-OpenSource/hurl"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "hurl-{version}-{arch}-unknown-linux-gnu.tar.gz"
checksum-file = "hurl-{version}-{arch}-unknown-linux-gnu.tar.gz.sha256"
archive-prefix = "hurl-{version}-{arch}-unknown-linux-gnu"
exe-path = "bin/hurl"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "hurl-{version}-{arch}-apple-darwin.tar.gz"
checksum-file = "hurl-{version}-{arch}-apple-darwin.tar.gz.sha256"
archive-prefix = "hurl-{version}-{arch}-apple-darwin"
exe-path = "bin/hurl"

[platform.windows]
archs = ["x64"]
download-file = "hurl-{version}-{arch}-pc-windows-msvc.zip"
checksum-file = "hurl-{version}-{arch}-pc-windows-msvc.zip.sha256"

[install]
download-url = "https://github.com/Orange-OpenSource/hurl/releases/download/{version}/{download_file}"
checksum-url = "https://github.com/Orange-OpenSource/hurl/releases/download/{version}/{checksum_file}"

[install.exes.hurlfmt]
exe-path = "bin/hurlfmt"
