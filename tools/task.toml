name = "Task"
type = "cli"

[plugin]
description = "Task is a task runner / build tool that aims to be simpler and easier to use than, for example, GNU Make."
homepage-url = "https://taskfile.dev/"
repository-url = "https://github.com/go-task/task"

[resolve]
git-url = "https://github.com/go-task/task"

[platform.linux]
archs = ["x86", "x64", "arm", "arm64", "riscv64"]
download-file = "task_linux_{arch}.tar.gz"
checksum-file = "task_checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "task_darwin_{arch}.tar.gz"
checksum-file = "task_checksums.txt"

[platform.windows]
archs = ["x86", "x64", "arm64"]
download-file = "task_windows_{arch}.zip"
checksum-file = "task_checksums.txt"

[platform.freebsd]
archs = ["x86", "x64", "arm", "arm64"]
download-file = "task_freebsd_{arch}.tar.gz"
checksum-file = "task_checksums.txt"

[install]
download-url = "https://github.com/go-task/task/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/go-task/task/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86 = "386"
x86_64 = "amd64"
