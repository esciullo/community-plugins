name = "shfmt"
type = "cli"

[plugin]
description = "A shell formatter for POSIX Shell, Bash and mksh."
repository-url = "https://github.com/mvdan/sh"

[resolve]
git-url = "https://github.com/mvdan/sh"

[platform.linux]
download-file = "shfmt_v{version}_linux_{arch}"
archs = ["x86", "x64", "arm", "arm64"]

[platform.macos]
download-file = "shfmt_v{version}_darwin_{arch}"
archs = ["x64", "arm64"]

[platform.windows]
download-file = "shfmt_v{version}_windows_{arch}.exe"
archs = ["x86", "x64"]

[install]
download-url = "https://github.com/mvdan/sh/releases/download/v{version}/{download_file}"

[install.arch]
x86 = "386"
x86_64 = "amd64"
aarch64 = "arm64"
