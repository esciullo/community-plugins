name = "Infisical"
type = "cli"

[plugin]
description = "The command-line interface for the open source secret management platform Infisical."
homepage-url = "https://infisical.com/"
repository-url = "https://github.com/Infisical/infisical"

[resolve]
git-url = "https://github.com/Infisical/infisical"
version-pattern = "^infisical-cli/v((?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+))"

[platform.linux]
archs = ["x86", "x64", "arm", "arm64"]
download-file = "infisical_{version}_linux_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "infisical_{version}_darwin_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.windows]
archs = ["x64", "arm", "arm64"]
download-file = "infisical_{version}_windows_{arch}.zip"
checksum-file = "checksums.txt"

[platform.freebsd]
archs = ["x64", "arm", "arm64"]
download-file = "infisical_{version}_freebsd_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.netbsd]
archs = ["x86", "x64", "arm", "arm64"]
download-file = "infisical_{version}_netbsd_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.openbsd]
archs = ["x86", "x64", "arm", "arm64"]
download-file = "infisical_{version}_openbsd_{arch}.tar.gz"
checksum-file = "checksums.txt"

[install]
download-url = "https://github.com/Infisical/infisical/releases/download/infisical-cli/v{version}/{download_file}"
checksum-url = "https://github.com/Infisical/infisical/releases/download/infisical-cli/v{version}/{checksum_file}"

[install.arch]
x86 = "386"
x86_64 = "amd64"
arm = "armv6"
aarch64 = "arm64"
